name: Compila l'eseguibile Windows

# Ad ogni tag "v*" costruisce il programma su una macchina Windows e allega alla
# release due cose: il pacchetto zip da estrarre sulla share, che e' il modo
# consigliato, e il singolo eseguibile per chi lo preferisce.
#
# Il pacchetto usa la forma "onedir": l'eseguibile sta accanto alle sue
# librerie invece di scompattarsi in una cartella temporanea a ogni avvio.
# Parte piu' in fretta da una share e da molti meno grattacapi agli antivirus,
# che guardano male i file che si autoestraggono.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Compila il pacchetto da estrarre sulla share
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --noconsole
          --name Inventario --collect-submodules openpyxl Inventario.py

      - name: Compila anche il singolo eseguibile
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --distpath dist-unico --workpath build-unico
          --name Inventario --collect-submodules openpyxl Inventario.py

      - name: Prepara la cartella da copiare in rete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Distribuzione | Out-Null
          Copy-Item dist\Inventario\* Distribuzione\ -Recurse
          Copy-Item LEGGIMI-PRIMA.txt Distribuzione\
          Copy-Item "Crea collegamento sul desktop.bat" Distribuzione\
          Copy-Item README.md Distribuzione\"Come funziona.txt"
          # le cartelle di lavoro esistono gia' quando il programma parte
          New-Item -ItemType Directory -Force -Path Distribuzione\Backup | Out-Null
          Copy-Item Backup\.gitignore Distribuzione\Backup\ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path Distribuzione\Produzione | Out-Null
          Copy-Item Produzione\.gitignore Distribuzione\Produzione\ -ErrorAction SilentlyContinue
          # i file di collaudo viaggiano con il programma
          New-Item -ItemType Directory -Force -Path Distribuzione\Collaudo | Out-Null
          Copy-Item Collaudo\*.xlsx Distribuzione\Collaudo\
          Copy-Item Collaudo\README.md Distribuzione\Collaudo\
          Copy-Item Collaudo\README.en.md Distribuzione\Collaudo\
          Compress-Archive -Path Distribuzione\* -DestinationPath Inventario-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Inventario-windows
          path: Inventario-windows.zip

      - name: Allega alla release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Inventario-windows.zip
            dist-unico/Inventario.exe
