name: Compila il pacchetto Windows

# Ad ogni tag "v*" costruisce il pacchetto su una macchina Windows e lo allega
# alla release.
#
# Dentro non c'e' nessun eseguibile costruito da noi: ci sono il Python
# incorporabile ufficiale di python.org, firmato dalla Python Software
# Foundation, e il programma in chiaro come file .py. E' quello che permette di
# installarlo dove la sicurezza aziendale guarda i binari non firmati.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: python -m pip install --upgrade pip openpyxl

      - name: Monta il Python incorporabile
        shell: pwsh
        run: |
          $ver = "3.12.10"
          $zip = "python-$ver-embed-amd64.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$ver/$zip" -OutFile $zip
          New-Item -ItemType Directory -Force -Path Pacchetto\python | Out-Null
          Expand-Archive $zip -DestinationPath Pacchetto\python

          # Il pacchetto incorporabile di python.org non contiene Tkinter: si
          # prende dalla stessa versione ufficiale gia' installata sul runner.
          $full = $env:pythonLocation
          Copy-Item "$full\DLLs\_tkinter.pyd" Pacchetto\python\
          Copy-Item "$full\DLLs\tcl86t.dll"   Pacchetto\python\
          Copy-Item "$full\DLLs\tk86t.dll"    Pacchetto\python\
          Copy-Item "$full\DLLs\zlib1.dll"    Pacchetto\python\ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path Pacchetto\python\Lib | Out-Null
          Copy-Item "$full\Lib\tkinter" Pacchetto\python\Lib\ -Recurse
          Copy-Item "$full\tcl" Pacchetto\python\tcl -Recurse

          # Percorsi di ricerca: la libreria compressa, questa cartella, la
          # cartella del programma (..), Lib e le librerie installate.
          $pth = Get-ChildItem Pacchetto\python\python*._pth | Select-Object -First 1
          $lib = (Get-Content $pth.FullName)[0]
          @(
            $lib, ".", "..", "Lib", "Lib\site-packages", "import site"
          ) | Set-Content $pth.FullName -Encoding ascii

          python -m pip install --no-compile --target Pacchetto\python\Lib\site-packages openpyxl

      - name: Controlla la firma e che il programma parta davvero
        shell: pwsh
        run: |
          Get-AuthenticodeSignature Pacchetto\python\pythonw.exe |
            Format-List Status, StatusMessage, SignerCertificate
          Copy-Item Inventario.py Pacchetto\
          Copy-Item inventario Pacchetto\inventario -Recurse
          # import di tutto quello che serve, con i percorsi veri del pacchetto
          Pacchetto\python\python.exe -c "import tkinter, openpyxl, inventario.ui; print('avvio possibile')"

      - name: Verifica lo sblocco automatico nei .bat
        shell: pwsh
        run: |
          # Le prime righe di ognuno dei quattro .bat tolgono il contrassegno
          # "scaricato da Internet" da tutta la cartella al primo avvio, cosi'
          # l'avviso di Windows compare una volta sola invece che su ogni file.
          # Qui si prova la stessa sequenza isolata, in una cartella a parte,
          # perche' non si puo' verificarla aprendo i .bat veri: aspettano un
          # tasto (pause) o accendono l'interfaccia grafica.
          $righe = @(
            '@echo off',
            'if exist "%~dp0.sbloccato" goto :gia_sbloccato',
            'powershell -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -Command "Get-ChildItem -LiteralPath ''%~dp0'' -Recurse -File -ErrorAction SilentlyContinue | Unblock-File -ErrorAction SilentlyContinue" >nul 2>&1',
            'type nul > "%~dp0.sbloccato" 2>nul',
            'attrib +h "%~dp0.sbloccato" >nul 2>&1',
            ':gia_sbloccato',
            'exit /b 0'
          )
          New-Item -ItemType Directory -Force -Path prova_sblocco | Out-Null
          Set-Content -Path "prova_sblocco\prova.bat" -Value $righe

          cmd /c "prova_sblocco\prova.bat"
          if ($LASTEXITCODE -ne 0) {
            throw "il file di prova e' uscito con codice $LASTEXITCODE"
          }
          if (-not (Test-Path "prova_sblocco\.sbloccato")) {
            throw "il marcatore .sbloccato non e' stato creato"
          }
          $attributi = (Get-Item "prova_sblocco\.sbloccato" -Force).Attributes
          if ($attributi -notmatch "Hidden") {
            throw "il marcatore non risulta nascosto: $attributi"
          }
          Write-Host "Sblocco automatico: marcatore creato e nascosto, come atteso."

          # la seconda volta deve saltare tutto e uscire subito, senza rifare niente
          Remove-Item "prova_sblocco\.sbloccato" -Force
          Set-Content -Path "prova_sblocco\.sbloccato" -Value "gia' fatto"
          $prima = Get-Content "prova_sblocco\.sbloccato" -Raw
          cmd /c "prova_sblocco\prova.bat"
          if ($LASTEXITCODE -ne 0) {
            throw "il secondo avvio e' uscito con codice $LASTEXITCODE"
          }
          $dopo = Get-Content "prova_sblocco\.sbloccato" -Raw
          if ($prima -ne $dopo) {
            throw "il secondo avvio ha rifatto lo sblocco invece di saltarlo"
          }
          Write-Host "Al secondo avvio salta lo sblocco, come atteso."

          Remove-Item -Recurse -Force prova_sblocco

      - name: Prepara la cartella da distribuire
        shell: pwsh
        run: |
          Copy-Item LEGGIMI-PRIMA.txt Pacchetto\
          Copy-Item "Crea collegamento sul desktop.bat" Pacchetto\
          Copy-Item "Collega inventario condiviso.bat" Pacchetto\
          Copy-Item "Diagnostica.bat" Pacchetto\
          Copy-Item "Avvia Inventario.bat" Pacchetto\
          Copy-Item README.md Pacchetto\"Come funziona.txt"
          New-Item -ItemType Directory -Force -Path Pacchetto\Produzione | Out-Null
          Copy-Item Produzione\.gitignore Pacchetto\Produzione\ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path Pacchetto\Collaudo | Out-Null
          Copy-Item Collaudo\*.xlsx Pacchetto\Collaudo\
          Copy-Item Collaudo\README.md Pacchetto\Collaudo\
          Copy-Item Collaudo\README.en.md Pacchetto\Collaudo\
          Remove-Item Pacchetto\inventario\__pycache__ -Recurse -ErrorAction SilentlyContinue
          Get-ChildItem Pacchetto -Recurse -File | ForEach-Object {
            if ($_.IsReadOnly) { $_.IsReadOnly = $false }
          }
          Compress-Archive -Path Pacchetto\* -DestinationPath Inventario-windows.zip

      - name: Nessun file in sola lettura nel pacchetto
        shell: pwsh
        run: |
          $bloccati = Get-ChildItem Pacchetto -Recurse -File |
            Where-Object { $_.IsReadOnly }
          if ($bloccati) {
            $bloccati | Select-Object -First 10 FullName | Format-Table
            throw "$($bloccati.Count) file sono in sola lettura: sulla postazione non si lasceranno aggiornare."
          }
          Write-Host "Nessun file in sola lettura."

      - uses: actions/upload-artifact@v4
        with:
          name: Inventario-windows
          path: Inventario-windows.zip

      - name: Allega alla release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Inventario-windows.zip
